<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>srcdoc iframe test</title>
    <style>
        body {
            font-family: sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        h2 {
            margin-bottom: 8px;
        }

        p {
            color: #555;
            margin-bottom: 16px;
            font-size: 14px;
        }

        iframe {
            width: 100%;
            height: 800px;
            border: 2px dashed #aaa;
            border-radius: 8px;
            background: #fff;
        }
    </style>
</head>

<body>
    <h2>srcdoc iframe test</h2>
    <p>
        This page URL contains the preset params (same as the real parent page).<br>
        The iframe below is loaded via <code>srcdoc</code>, simulating the production embed.<br>
        <strong>Expected:</strong> the plan details for BU-18115 should appear inside the iframe.
    </p>
    <iframe id="testFrame"></iframe>

    <script>
        // Mimic how the real site embeds the summary page via srcdoc.
        // The iframe content is the actual summary page HTML fetched from the same origin.
        // The parent URL carries the params (as in production).

        // Step 1: Rewrite the current page URL to include the preset params.
        const params = '?preset=BU-18115&pkg=500%2F500_24M_499&price=599&name=MyPlan+500%2F500+Mesh+24M';
        if (!window.location.search) {
            // Redirect self with params so window.parent.location.search is non-empty
            window.location.href = window.location.pathname + params;
        } else {
            // Step 2: Fetch the real summary page HTML and inject it as srcdoc
            fetch('/promotion/true-online/myplan-summary/')
                .then(r => r.text())
                .then(html => {
                    document.getElementById('testFrame').srcdoc = html;
                })
                .catch(err => {
                    document.getElementById('testFrame').srcdoc =
                        '<p style="color:red;padding:20px">Failed to fetch summary page: ' + err.message + '</p>';
                });
        }
    </script>
</body>

</html>
